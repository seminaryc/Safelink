<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeLink</title>
</head>
<body>
  <h2 id="status">Preparing your Video...</h2>

  <script src="./links.js"></script>

  <script>
    const code = window.location.hash.slice(1).trim();

    if (!code) {
      document.getElementById("status").textContent =
        "The link code was not found.";
    } else {
      const target = links[code];

      if (target) {
        window.location.replace(target);
      } else {
        document.getElementById("status").textContent =
          "Link not found or no longer available.";
      }
    }
  </script>
</body>
</html>
